appId: com.mattwright.aivplayer
productName: aIVplayer
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
win:
  target:
    - target: zip
      arch: [x64]
  icon: build/icon.png
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  category: AudioVideo
  synopsis: Three-speaker (L-R difference) FLAC player for two PCs
  icon: build/icon.png

# macOS is configured but NOT published: builds from Linux cannot be code signed
# ("supported only on macOS"), and an unsigned bundle is refused by Gatekeeper with
# "aIVplayer is damaged and can't be opened". Build it with `npx electron-builder --mac zip`
# only on a Mac that can sign, or once someone can actually test the result.
mac:
  target:
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.music
  icon: build/icon.png
  extendInfo:
    # macOS 15+ gates discovery and the hub behind Local Network permission; this is the
    # explanation shown in that prompt. Without the key the prompt has no reason text.
    NSLocalNetworkUsageDescription: >-
      aIVplayer uses your local network to find the other PC running aIVplayer and to send it
      the rear speaker's audio.
